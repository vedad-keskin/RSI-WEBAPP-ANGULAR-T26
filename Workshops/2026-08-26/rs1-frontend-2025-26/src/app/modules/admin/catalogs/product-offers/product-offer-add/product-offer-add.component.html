<section class="form-page">
  <header>
    <button mat-icon-button title="Nazad" (click)="cancel()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1>Nova promotivna ponuda</h1>
  </header>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="outline">
      <mat-label>Oznaka</mat-label>
      <input matInput formControlName="code" placeholder="OFF-..." />
      <mat-error *ngIf="hasError('code')">{{ getErrorMessage('code') }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Proizvod</mat-label>
      <mat-select formControlName="productId">
        @for (product of products; track product.id) {
          <mat-option [value]="product.id">{{ product.name }}</mat-option>
        }
      </mat-select>
      <mat-error *ngIf="hasError('productId')">{{ getErrorMessage('productId') }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Popust (%)</mat-label>
      <input matInput type="number" formControlName="discountPercent" step="0.01" />
      <mat-error *ngIf="hasError('discountPercent')">{{ getErrorMessage('discountPercent') }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Vazi do</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="validUntilUtc" />
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
      <mat-error *ngIf="hasError('validUntilUtc')">{{ getErrorMessage('validUntilUtc') }}</mat-error>
    </mat-form-field>

    <div class="actions">
      <button mat-button type="button" (click)="cancel()" [disabled]="isLoading">Odustani</button>
      <button
        mat-flat-button
        color="primary"
        type="submit"
        [disabled]="form.invalid || isLoading"
      >
        Sacuvaj
      </button>
    </div>
  </form>
</section>
